<!DOCTYPE html>
<html>
  <head>
    <title>JS Button Example</title>
  </head>
  <body>
    <h1>Click the Button!</h1>

    <button onclick="sayHello()">Say Hello</button>

    <script>
      function sayHello() {
        alert("Hello from JavaScript!");
      }
    </script>

    <button onclick="tellMeAJoke()"> Tell Me A Joke"</button>

    <script>
        function tellMeAJoke(){
            alert("Why is 6 afraid of 7? Bc 789!");
        }
    </script>
  </body>
</html>
